<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Gravitational & Galaxy Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; color: #f3f4f6; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .panel {
      position: absolute; z-index: 10; background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; padding: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    #controls { top: 12px; left: 12px; width: 280px; max-height: calc(100vh - 24px); overflow-y: auto; }
    #toolbar { top: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    #stats { bottom: 12px; right: 12px; width: 260px; }
    
    h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .control-group { margin-bottom: 12px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
    
    .btn {
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0; padding: 8px 12px; font-size: 12px; font-weight: 600;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn:active { transform: scale(0.96); background: #0284c7; }
    .btn-danger { background: rgba(225, 29, 72, 0.2); border-color: rgba(225, 29, 72, 0.4); color: #fecdd3; }
    
    .stat-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .stat-val { font-family: monospace; font-weight: 600; color: #38bdf8; }
    #chart-container { height: 60px; margin-top: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="toolbar" class="panel">
    <button class="btn" id="btnGalaxy">Galaxy</button>
    <button class="btn" id="btnSolar">Solar System</button>
    <button class="btn" id="btnCloud">Star Cloud</button>
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn btn-danger" id="resetBtn">Reset</button>
  </div>

  <div id="controls" class="panel">
    <h2>N-Body Parameters</h2>
    <div class="control-group">
      <label>Particle Count <span id="slider-particles-val" class="stat-val">1000</span></label>
      <input type="range" id="slider-particles" min="200" max="2500" step="100" value="1000">
    </div>
    <div class="control-group">
      <label>Gravity (G) <span id="slider-gravity-val" class="stat-val">1.5</span></label>
      <input type="range" id="slider-gravity" min="0.1" max="5.0" step="0.1" value="1.5">
    </div>
    <div class="control-group">
      <label>Softening <span id="slider-softening-val" class="stat-val">120</span></label>
      <input type="range" id="slider-softening" min="10" max="500" step="10" value="120">
    </div>
    <div class="control-group">
      <label>Time Step (dt) <span id="slider-dt-val" class="stat-val">0.012</span></label>
      <input type="range" id="slider-dt" min="0.001" max="0.03" step="0.001" value="0.012">
    </div>
  </div>

  <div id="stats" class="panel">
    <h2>Telemetry <span id="stat-fps" style="color:#10b981;">60 FPS</span></h2>
    <div class="stat-row"><span>Calc Time</span><span id="stat-calc-time" class="stat-val">0.0 ms</span></div>
    <div class="stat-row"><span>Kinetic Energy</span><span id="stat-ek" class="stat-val">0</span></div>
    <div class="stat-row"><span>Potential Energy</span><span id="stat-ep" class="stat-val">0</span></div>
    <div class="stat-row"><span>Energy Drift</span><span id="stat-drift" class="stat-val">0.00%</span></div>
    <div id="chart-container"><canvas id="energyChart"></canvas></div>
  </div>

  <script>
    class NBodySim {
      constructor() {
        this.maxN = 3000;
        this.N = 1000;
        this.G = 1.5;
        this.softening = 120;
        this.dt = 0.012;
        this.isPaused = false;
        
        this.posX = new Float32Array(this.maxN);
        this.posY = new Float32Array(this.maxN);
        this.posZ = new Float32Array(this.maxN);
        this.velX = new Float32Array(this.maxN);
        this.velY = new Float32Array(this.maxN);
        this.velZ = new Float32Array(this.maxN);
        this.accX = new Float32Array(this.maxN);
        this.accY = new Float32Array(this.maxN);
        this.accZ = new Float32Array(this.maxN);
        this.mass = new Float32Array(this.maxN);
        this.vMag = new Float32Array(this.maxN);
        this.flatPos = new Float32Array(this.maxN * 3);

        this.touchActive = false;
        this.touchPos = new THREE.Vector3();
        this.initialEnergy = 0;
        this.lastTime = performance.now();
        this.frameCount = 0;

        this.initThree();
        this.initParticles();
        this.initGrid();
        this.initTouch();
        this.initChart();
        this.initUI();
        this.loadPreset('galaxy');
        this.animate();
      }

      initThree() {
        const container = document.getElementById('canvas-container');
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        this.camera.position.set(0, 600, 900);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(this.renderer.domElement);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;

        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      initParticles() {
        this.geometry = new THREE.BufferGeometry();
        this.posAttr = new THREE.BufferAttribute(this.flatPos, 3);
        this.vMagAttr = new THREE.BufferAttribute(this.vMag, 1);
        this.geometry.setAttribute('position', this.posAttr);
        this.geometry.setAttribute('vMag', this.vMagAttr);

        this.material = new THREE.ShaderMaterial({
          vertexShader: `
            attribute float vMag;
            varying float vVelocity;
            void main() {
              vVelocity = vMag;
              vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = clamp(200.0 / -mvPosition.z, 2.5, 7.0);
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            varying float vVelocity;
            void main() {
              float d = length(gl_PointCoord - vec2(0.5));
              if (d > 0.5) discard;
              float alpha = smoothstep(0.5, 0.0, d);
              float normV = clamp(vVelocity / 15.0, 0.0, 1.0);
              vec3 color = mix(vec3(0.0, 0.6, 1.0), vec3(0.7, 0.2, 1.0), smoothstep(0.0, 0.5, normV));
              color = mix(color, vec3(1.0, 0.8, 0.2), smoothstep(0.5, 1.0, normV));
              gl_FragColor = vec4(color, alpha * 0.9);
            }
          `,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        this.points = new THREE.Points(this.geometry, this.material);
        this.scene.add(this.points);
      }

      initGrid() {
        this.gridGeo = new THREE.PlaneGeometry(1200, 1200, 30, 30);
        this.gridGeo.rotateX(-Math.PI / 2);
        this.gridOrigY = new Float32Array(this.gridGeo.attributes.position.count);
        for(let i=0; i<this.gridOrigY.length; i++) this.gridOrigY[i] = this.gridGeo.attributes.position.getY(i);

        const gridMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.15 });
        this.gridMesh = new THREE.Mesh(this.gridGeo, gridMat);
        this.gridMesh.position.y = -200;
        this.scene.add(this.gridMesh);
      }

      initTouch() {
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        const getPos = (e) => e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };

        const start = (e) => {
          if (e.target.closest('.panel')) return;
          const p = getPos(e);
          mouse.x = (p.x / window.innerWidth) * 2 - 1;
          mouse.y = -(p.y / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, this.camera);
          if (raycaster.ray.intersectPlane(plane, this.touchPos)) this.touchActive = true;
        };

        const move = (e) => {
          if (!this.touchActive) return;
          const p = getPos(e);
          mouse.x = (p.x / window.innerWidth) * 2 - 1;
          mouse.y = -(p.y / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, this.camera);
          raycaster.ray.intersectPlane(plane, this.touchPos);
        };

        const end = () => this.touchActive = false;

        window.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        window.addEventListener('touchstart', start, { passive: true });
        window.addEventListener('touchmove', move, { passive: true });
        window.addEventListener('touchend', end);
      }

      initChart() {
        const ctx = document.getElementById('energyChart');
        if (!ctx) return;
        this.chart = new Chart(ctx.getContext('2d'), {
          type: 'line',
          data: {
            labels: Array(20).fill(''),
            datasets: [
              { label: 'Ek', data: Array(20).fill(0), borderColor: '#10b981', borderWidth: 1.5, pointRadius: 0 },
              { label: 'Ep', data: Array(20).fill(0), borderColor: '#a855f7', borderWidth: 1.5, pointRadius: 0 },
              { label: 'Et', data: Array(20).fill(0), borderColor: '#f59e0b', borderWidth: 1.5, pointRadius: 0 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
        });
      }

      loadPreset(preset) {
        for(let i=0; i<this.maxN; i++) {
          this.posX[i] = 0; this.posY[i] = 0; this.posZ[i] = 0;
          this.velX[i] = 0; this.velY[i] = 0; this.velZ[i] = 0;
          this.mass[i] = 1.0;
        }

        if (preset === 'galaxy') {
          const half = Math.floor(this.N / 2);
          this.spawnSubGalaxy(0, -400, 0, 0, 0, 12, 0, half, 450);
          this.spawnSubGalaxy(half, 400, 0, 0, 0, -12, 0, this.N - half, 450);
        } else if (preset === 'solar') {
          this.mass[0] = 6000;
          for (let i = 1; i < this.N; i++) {
            const r = 100 + Math.random() * 800;
            const a = Math.random() * Math.PI * 2;
            this.posX[i] = r * Math.cos(a);
            this.posZ[i] = r * Math.sin(a);
            this.posY[i] = (Math.random() - 0.5) * 6;
            const v = Math.sqrt((this.G * 6000) / r);
            this.velX[i] = -v * Math.sin(a);
            this.velZ[i] = v * Math.cos(a);
            this.mass[i] = 0.5 + Math.random() * 2;
          }
        } else if (preset === 'cloud') {
          for (let i = 0; i < this.N; i++) {
            const r = Math.cbrt(Math.random()) * 600;
            const a = Math.random() * Math.PI * 2;
            const p = Math.acos(2 * Math.random() - 1);
            this.posX[i] = r * Math.sin(p) * Math.cos(a);
            this.posY[i] = r * Math.sin(p) * Math.sin(a);
            this.posZ[i] = r * Math.cos(p);
            this.velX[i] = -this.posZ[i] * 0.06 + (Math.random() - 0.5) * 0.4;
            this.velY[i] = (Math.random() - 0.5) * 0.4;
            this.velZ[i] = this.posX[i] * 0.06 + (Math.random() - 0.5) * 0.4;
          }
        }
        this.computeEnergies(true);
      }

      spawnSubGalaxy(offset, cx, cy, cz, vx, vy, vz, count, radius) {
        this.mass[offset] = 3000;
        this.posX[offset] = cx; this.posY[offset] = cy; this.posZ[offset] = cz;
        this.velX[offset] = vx; this.velY[offset] = vy; this.velZ[offset] = vz;

        for (let i = 1; i < count; i++) {
          const idx = offset + i;
          const r = Math.sqrt(Math.random()) * radius + 30;
          const a = Math.random() * Math.PI * 2;
          this.posX[idx] = cx + r * Math.cos(a);
          this.posY[idx] = cy + (Math.random() - 0.5) * 12;
          this.posZ[idx] = cz + r * Math.sin(a);
          const v = Math.sqrt((this.G * 3000) / r);
          this.velX[idx] = vx - v * Math.sin(a);
          this.velY[idx] = vy;
          this.velZ[idx] = vz + v * Math.cos(a);
        }
      }

      updatePhysics() {
        if (this.isPaused) return;

        const N = this.N;
        const eps2 = this.softening;
        const maxV = 90.0;

        for (let i = 0; i < N; i++) {
          let ax = 0, ay = 0, az = 0;
          const px = this.posX[i], py = this.posY[i], pz = this.posZ[i];

          for (let j = 0; j < N; j++) {
            if (i === j) continue;
            const dx = this.posX[j] - px;
            const dy = this.posY[j] - py;
            const dz = this.posZ[j] - pz;
            const distSq = dx * dx + dy * dy + dz * dz + eps2;
            const invDist3 = 1.0 / (distSq * Math.sqrt(distSq));
            const f = this.G * this.mass[j] * invDist3;
            ax += dx * f; ay += dy * f; az += dz * f;
          }

          if (this.touchActive) {
            const dx = this.touchPos.x - px, dy = this.touchPos.y - py, dz = this.touchPos.z - pz;
            const distSq = dx * dx + dy * dy + dz * dz + 400;
            const f = (this.G * 10000) / (distSq * Math.sqrt(distSq));
            ax += dx * f; ay += dy * f; az += dz * f;
          }

          this.accX[i] = ax; this.accY[i] = ay; this.accZ[i] = az;
        }

        for (let i = 0; i < N; i++) {
          this.velX[i] += this.accX[i] * this.dt;
          this.velY[i] += this.accY[i] * this.dt;
          this.velZ[i] += this.accZ[i] * this.dt;

          const vSq = this.velX[i]**2 + this.velY[i]**2 + this.velZ[i]**2;
          if (vSq > maxV * maxV) {
            const s = maxV / Math.sqrt(vSq);
            this.velX[i] *= s; this.velY[i] *= s; this.velZ[i] *= s;
          }

          this.posX[i] += this.velX[i] * this.dt;
          this.posY[i] += this.velY[i] * this.dt;
          this.posZ[i] += this.velZ[i] * this.dt;

          if (!Number.isFinite(this.posX[i]) || Math.abs(this.posX[i]) > 5000) {
            this.posX[i] = (Math.random() - 0.5) * 300;
            this.posY[i] = (Math.random() - 0.5) * 300;
            this.posZ[i] = (Math.random() - 0.5) * 300;
            this.velX[i] = 0; this.velY[i] = 0; this.velZ[i] = 0;
          }

          this.vMag[i] = Math.sqrt(vSq);
          this.flatPos[i * 3] = this.posX[i];
          this.flatPos[i * 3 + 1] = this.posY[i];
          this.flatPos[i * 3 + 2] = this.posZ[i];
        }

        this.geometry.attributes.position.needsUpdate = true;
        this.geometry.attributes.vMag.needsUpdate = true;
        this.geometry.setDrawRange(0, N);

        this.updateGrid();
        this.computeEnergies(false);
      }

      updateGrid() {
        if (!this.gridGeo) return;
        const posAttr = this.gridGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
          const gx = posAttr.getX(i), gz = posAttr.getZ(i);
          let dip = 0;
          for (let p = 0; p < Math.min(this.N, 10); p++) {
            if (this.mass[p] > 200) {
              const dx = gx - this.posX[p], dz = gz - this.posZ[p];
              dip += (this.mass[p] * 50) / Math.sqrt(dx * dx + dz * dz + 6000);
            }
          }
          posAttr.setY(i, this.gridOrigY[i] - Math.min(dip, 250));
        }
        posAttr.needsUpdate = true;
      }

      computeEnergies(setInitial = false) {
        let ek = 0, ep = 0;
        const N = this.N;
        for (let i = 0; i < N; i++) ek += 0.5 * this.mass[i] * (this.velX[i]**2 + this.velY[i]**2 + this.velZ[i]**2);
        for (let i = 0; i < Math.min(N, 60); i++) {
          for (let j = i + 1; j < Math.min(N, 60); j++) {
            const dx = this.posX[j] - this.posX[i], dy = this.posY[j] - this.posY[i], dz = this.posZ[j] - this.posZ[i];
            ep -= (this.G * this.mass[i] * this.mass[j]) / Math.sqrt(dx*dx + dy*dy + dz*dz + this.softening);
          }
        }
        const et = ek + ep;
        if (setInitial || !Number.isFinite(this.initialEnergy)) this.initialEnergy = et;
        const drift = Math.abs((et - this.initialEnergy) / (this.initialEnergy || 1)) * 100;

        document.getElementById('stat-ek').innerText = ek.toFixed(0);
        document.getElementById('stat-ep').innerText = ep.toFixed(0);
        document.getElementById('stat-drift').innerText = (Number.isFinite(drift) ? drift.toFixed(2) : '0.00') + '%';

        if (this.chart && this.frameCount % 10 === 0) {
          const ds = this.chart.data.datasets;
          ds[0].data.shift(); ds[0].data.push(ek);
          ds[1].data.shift(); ds[1].data.push(ep);
          ds[2].data.shift(); ds[2].data.push(et);
          this.chart.update('none');
        }
      }

      initUI() {
        const stop = (e) => e.stopPropagation();

        const pauseBtn = document.getElementById('pauseBtn');
        pauseBtn.addEventListener('click', (e) => { stop(e); this.isPaused = !this.isPaused; pauseBtn.innerText = this.isPaused ? 'Resume' : 'Pause'; });

        document.getElementById('resetBtn').addEventListener('click', (e) => { stop(e); this.loadPreset('galaxy'); });

        const bindPreset = (id, p) => {
          const btn = document.getElementById(id);
          btn.addEventListener('click', (e) => { stop(e); this.loadPreset(p); });
          btn.addEventListener('touchstart', stop, { passive: true });
        };
        bindPreset('btnGalaxy', 'galaxy');
        bindPreset('btnSolar', 'solar');
        bindPreset('btnCloud', 'cloud');

        const bindSlider = (id, prop, parseFn = parseFloat) => {
          const el = document.getElementById(id);
          el.addEventListener('input', (e) => {
            this[prop] = parseFn(e.target.value);
            document.getElementById(`${id}-val`).innerText = e.target.value;
          });
          el.addEventListener('touchstart', stop, { passive: true });
        };
        bindSlider('slider-particles', 'N', parseInt);
        bindSlider('slider-gravity', 'G');
        bindSlider('slider-softening', 'softening');
        bindSlider('slider-dt', 'dt');
      }

      animate() {
        requestAnimationFrame(() => this.animate());
        const t0 = performance.now();
        this.updatePhysics();
        const tCalc = performance.now() - t0;

        this.controls.update();
        this.renderer.render(this.scene, this.camera);

        this.frameCount++;
        const now = performance.now();
        if (now - this.lastTime >= 1000) {
              document.getElementById('stat-fps').innerText = Math.round((this.frameCount * 1000) / (now - this.lastTime)) + ' FPS';
          document.getElementById('stat-calc-time').innerText = tCalc.toFixed(1) + ' ms';
          this.frameCount = 0;
          this.lastTime = now;
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new NBodySim();
    });
  </script>
</body>
</html>

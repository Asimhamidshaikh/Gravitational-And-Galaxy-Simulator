<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Gravitational & Galaxy N-Body Simulator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #030712;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden">

  <!-- Header -->
  <header class="fixed top-4 left-4 z-10 glass-panel p-4 rounded-xl shadow-2xl max-w-xs pointer-events-auto">
    <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
      N-Body Gravity Lab
    </h1>
    <p class="text-xs text-gray-400 mt-1">Real-time gravitational particle dynamics</p>
  </header>

  <!-- Control Panel -->
  <div class="fixed top-4 right-4 z-10 glass-panel p-4 rounded-xl shadow-2xl w-80 max-h-[90vh] overflow-y-auto pointer-events-auto text-sm space-y-4">
    <div>
      <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Presets</label>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="window.sim.loadPreset('galaxy')" class="px-2 py-1.5 bg-cyan-600/30 border border-cyan-500/40 rounded-lg hover:bg-cyan-600/50 text-xs font-medium transition">Galaxy</button>
        <button onclick="window.sim.loadPreset('solar')" class="px-2 py-1.5 bg-cyan-600/30 border border-cyan-500/40 rounded-lg hover:bg-cyan-600/50 text-xs font-medium transition">Solar System</button>
        <button onclick="window.sim.loadPreset('cloud')" class="px-2 py-1.5 bg-cyan-600/30 border border-cyan-500/40 rounded-lg hover:bg-cyan-600/50 text-xs font-medium transition">Cloud</button>
      </div>
    </div>

    <div class="space-y-3">
      <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">Parameters</label>
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-gray-400">Particles (N)</span>
          <span id="slider-n-val" class="text-cyan-400 font-mono">3000</span>
        </div>
        <input id="slider-n" type="range" min="500" max="10000" step="500" value="3000" class="w-full accent-cyan-500">
      </div>
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-gray-400">Gravity (G)</span>
          <span id="slider-g-val" class="text-cyan-400 font-mono">1.0</span>
        </div>
        <input id="slider-g" type="range" min="0.1" max="5.0" step="0.1" value="1.0" class="w-full accent-cyan-500">
      </div>
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-gray-400">Time Step (dt)</span>
          <span id="slider-dt-val" class="text-cyan-400 font-mono">0.6</span>
        </div>
        <input id="slider-dt" type="range" min="0.1" max="2.0" step="0.1" value="0.6" class="w-full accent-cyan-500">
      </div>
    </div>

    <!-- Telemetry Stats -->
    <div class="pt-2 border-t border-gray-700/50 space-y-1 text-xs">
      <div class="flex justify-between"><span class="text-gray-400">FPS:</span><span id="stat-fps" class="font-mono text-emerald-400">60 FPS</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Calc Time:</span><span id="stat-calc-time" class="font-mono text-cyan-400">0.0 ms</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Kinetic Energy:</span><span id="stat-kinetic" class="font-mono text-gray-300">0</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Potential Energy:</span><span id="stat-potential" class="font-mono text-gray-300">0</span></div>
    </div>
  </div>

  <!-- Simulation Script -->
  <script>
  class NBodySimulator {
    constructor() {
      this.maxN = 10000;
      this.N = 3000;
      this.G = 1.0;
      this.dt = 0.6;
      this.softening = 15.0;
      this.paused = false;

      this.posX = new Float32Array(this.maxN);
      this.posY = new Float32Array(this.maxN);
      this.posZ = new Float32Array(this.maxN);
      this.velX = new Float32Array(this.maxN);
      this.velY = new Float32Array(this.maxN);
      this.velZ = new Float32Array(this.maxN);
      this.accX = new Float32Array(this.maxN);
      this.accY = new Float32Array(this.maxN);
      this.accZ = new Float32Array(this.maxN);
      this.mass = new Float32Array(this.maxN);

      this.frameCount = 0;
      this.lastTime = performance.now();
      this.currentPreset = 'galaxy';

      this.initThree();
      this.initGrid();
      this.initTouchControls();
      this.bindControls();
      this.loadPreset('galaxy');
      this.animate();
    }

    initThree() {
      this.scene = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
      this.camera.position.set(0, 400, 700);

      this.renderer = new THREE.WebGLRenderer({ antialias: true });
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(this.renderer.domElement);

      this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
      this.controls.enableDamping = true;
      this.controls.dampingFactor = 0.05;

      this.geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(this.maxN * 3);
      this.colors = new Float32Array(this.maxN * 3);

      this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      this.geometry.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));

      const material = new THREE.PointsMaterial({
        size: 3,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });

      this.particles = new THREE.Points(this.geometry, material);
      this.scene.add(this.particles);

      window.addEventListener('resize', () => {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    initGrid() {
      this.gridGeo = new THREE.PlaneGeometry(1200, 1200, 40, 40);
      this.gridGeo.rotateX(-Math.PI / 2);

      const gridMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        wireframe: true,
        transparent: true,
        opacity: 0.12
      });

      this.gridMesh = new THREE.Mesh(this.gridGeo, gridMat);
      this.gridMesh.position.y = -220;
      this.scene.add(this.gridMesh);
    }

    initTouchControls() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      this.touchPos = new THREE.Vector3();

      const updateTouchPoint = (e) => {
        const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, this.camera);
        raycaster.ray.intersectPlane(plane, this.touchPos);
      };

      const onDown = (e) => {
        if (e.target.closest('.glass-panel') || e.target.closest('header')) return;
        this.touchActive = true;
        updateTouchPoint(e);
      };

      const onMove = (e) => {
        if (this.touchActive) updateTouchPoint(e);
      };

      const onUp = () => {
        this.touchActive = false;
      };

      window.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      window.addEventListener('touchstart', onDown, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onUp);
    }

    setDefaultColors() {
      for (let i = 0; i < this.maxN; i++) {
        this.colors[i * 3] = 0.2;
        this.colors[i * 3 + 1] = 0.6;
        this.colors[i * 3 + 2] = 1.0;
      }
    }

    loadPreset(type) {
      this.currentPreset = type;
      for (let i = 0; i < this.maxN; i++) {
        this.posX[i] = 0; this.posY[i] = 0; this.posZ[i] = 0;
        this.velX[i] = 0; this.velY[i] = 0; this.velZ[i] = 0;
        this.mass[i] = 1.0;
      }

      this.setDefaultColors();

      if (type === 'galaxy') {
        const half = Math.floor(this.N / 2);
        this.spawnGalaxy(0, -350, 0, 0, 0, 11, 0, half, 420);
        this.spawnGalaxy(half, 350, 0, 0, 0, -11, 0, this.N - half, 420);
      } else if (type === 'solar') {
        this.mass[0] = 5000;
        this.posX[0] = 0; this.posY[0] = 0; this.posZ[0] = 0;
        this.velX[0] = 0; this.velY[0] = 0; this.velZ[0] = 0;

        this.colors[0] = 1.0; this.colors[1] = 0.8; this.colors[2] = 0.2;

        for (let i = 1; i < this.N; i++) {
          const r = 120 + Math.random() * 750;
          const a = Math.random() * Math.PI * 2;
          this.posX[i] = r * Math.cos(a);
          this.posZ[i] = r * Math.sin(a);
          this.posY[i] = (Math.random() - 0.5) * 8;

          const v = Math.sqrt((this.G * 5000) / r);
          this.velX[i] = -v * Math.sin(a);
          this.velZ[i] = v * Math.cos(a);
          this.mass[i] = 0.5 + Math.random() * 2.0;
        }
      } else if (type === 'cloud') {
        for (let i = 0; i < this.N; i++) {
          const r = Math.cbrt(Math.random()) * 550;
          const a = Math.random() * Math.PI * 2;
          const p = Math.acos(2 * Math.random() - 1);

          this.posX[i] = r * Math.sin(p) * Math.cos(a);
          this.posY[i] = r * Math.sin(p) * Math.sin(a);
          this.posZ[i] = r * Math.cos(p);

          this.velX[i] = -this.posZ[i] * 0.05 + (Math.random() - 0.5) * 0.5;
          this.velY[i] = (Math.random() - 0.5) * 0.5;
          this.velZ[i] = this.posX[i] * 0.05 + (Math.random() - 0.5) * 0.5;
          this.mass[i] = 1.0 + Math.random() * 3.0;
        }
      }

      if (this.geometry) {
        this.geometry.setDrawRange(0, this.N);
        if (this.geometry.attributes.position) this.geometry.attributes.position.needsUpdate = true;
        if (this.geometry.attributes.color) this.geometry.attributes.color.needsUpdate = true;
      }
    }

    spawnGalaxy(offset, cx, cy, cz, vx, vy, vz, count, radius) {
      this.mass[offset] = 3500;
      this.posX[offset] = cx; this.posY[offset] = cy; this.posZ[offset] = cz;
      this.velX[offset] = vx; this.velY[offset] = vy; this.velZ[offset] = vz;

      for (let i = 1; i < count; i++) {
        const idx = offset + i;
        const r = Math.sqrt(Math.random()) * radius + 25;
        const a = Math.random() * Math.PI * 2;

        this.posX[idx] = cx + r * Math.cos(a);
        this.posY[idx] = cy + (Math.random() - 0.5) * 14;
        this.posZ[idx] = cz + r * Math.sin(a);

        const v = Math.sqrt((this.G * 3500) / r);
        this.velX[idx] = -v * Math.sin(a) + vx;
        this.velY[idx] = (Math.random() - 0.5) * 2 + vy;
        this.velZ[idx] = v * Math.cos(a) + vz;

        this.mass[idx] = 1.0;

        const color = new THREE.Color().setHSL(0.55 + (r / 400) * 0.25, 0.85, 0.6);
        this.colors[idx * 3] = color.r;
        this.colors[idx * 3 + 1] = color.g;
        this.colors[idx * 3 + 2] = color.b;
      }
    }

    updatePhysics() {
      const N = this.N;
      const dt = this.dt;
      const G = this.G;
      const eps2 = this.softening * this.softening;

      let totalKinetic = 0;
      let totalPotential = 0;

      for (let i = 0; i < N; i++) {
        this.accX[i] = 0;
        this.accY[i] = 0;
        this.accZ[i] = 0;
      }

      for (let i = 0; i < N; i++) {
        const xi = this.posX[i];
        const yi = this.posY[i];
        const zi = this.posZ[i];
        const mi = this.mass[i];

        for (let j = i + 1; j < N; j++) {
          const dx = this.posX[j] - xi;
          const dy = this.posY[j] - yi;
          const dz = this.posZ[j] - zi;
          const distSq = dx * dx + dy * dy + dz * dz + eps2;
          const dist = Math.sqrt(distSq);
          const invDist3 = 1.0 / (distSq * dist);

          const f = G * invDist3;
          const fx = f * dx;
          const fy = f * dy;
          const fz = f * dz;

          this.accX[i] += fx * this.mass[j];
          this.accY[i] += fy * this.mass[j];
          this.accZ[i] += fz * this.mass[j];

          this.accX[j] -= fx * mi;
          this.accY[j] -= fy * mi;
          this.accZ[j] -= fz * mi;

          totalPotential -= (G * mi * this.mass[j]) / dist;
        }

        if (this.touchActive && this.touchPos) {
          const dx = this.touchPos.x - xi;
          const dy = this.touchPos.y - yi;
          const dz = this.touchPos.z - zi;
          const distSq = dx * dx + dy * dy + dz * dz + eps2;
          const dist = Math.sqrt(distSq);
          const invDist3 = 1.0 / (distSq * dist);
          const touchMass = 10000;
          const f = G * touchMass * invDist3;

          this.accX[i] += f * dx;
          this.accY[i] += f * dy;
          this.accZ[i] += f * dz;
        }
      }

      const posAttr = this.geometry.attributes.position.array;

      for (let i = 0; i < N; i++) {
        this.velX[i] += this.accX[i] * dt;
        this.velY[i] += this.accY[i] * dt;
        this.velZ[i] += this.accZ[i] * dt;

        this.posX[i] += this.velX[i] * dt;
        this.posY[i] += this.velY[i] * dt;
        this.posZ[i] += this.velZ[i] * dt;

        const speedSq = this.velX[i] ** 2 + this.velY[i] ** 2 + this.velZ[i] ** 2;
        totalKinetic += 0.5 * this.mass[i] * speedSq;

        posAttr[i * 3] = this.posX[i];
        posAttr[i * 3 + 1] = this.posY[i];
        posAttr[i * 3 + 2] = this.posZ[i];
      }

      this.geometry.attributes.position.needsUpdate = true;

      const kEl = document.getElementById('stat-kinetic');
      if (kEl) kEl.innerText = Math.round(totalKinetic).toLocaleString();
      const pEl = document.getElementById('stat-potential');
      if (pEl) pEl.innerText = Math.round(totalPotential).toLocaleString();
    }

    bindControls() {
      const bind = (id, prop, transform = parseFloat) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', (e) => {
          this[prop] = transform(e.target.value);
          const valEl = document.getElementById(id + '-val');
          if (valEl) valEl.innerText = e.target.value;
          if (prop === 'N') this.loadPreset(this.currentPreset);
        });
      };

      bind('slider-n', 'N', parseInt);
      bind('slider-g', 'G');
      bind('slider-dt', 'dt');
    }

    animate() {
      requestAnimationFrame(() => this.animate());
      if (this.paused) return;

      const t0 = performance.now();
      this.updatePhysics();
      const tCalc = performance.now() - t0;

      this.controls.update();
      this.renderer.render(this.scene, this.camera);

      this.frameCount++;
      const now = performance.now();
      if (now - this.lastTime >= 1000) {
        const fpsEl = document.getElementById('stat-fps');
        if (fpsEl) fpsEl.innerText = Math.round((this.frameCount * 1000) / (now - this.lastTime)) + ' FPS';
        const calcEl = document.getElementById('stat-calc-time');
        if (calcEl) calcEl.innerText = tCalc.toFixed(1) + ' ms';
        this.frameCount = 0;
        this.lastTime = now;
      }
    }
  }

  window.addEventListener('load', () => {
    window.sim = new NBodySimulator();
  });
  </script>
</body>
</html>
